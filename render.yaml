# Recette de déploiement Render ("Blueprint") : le serveur de checklist valise.
# Les secrets ne sont PAS ici : DATABASE_URL se saisit dans l'interface Render,
# ACCES_SECRET est généré par Render (code aléatoire).
services:
  - type: web
    name: valise-fr
    runtime: python
    plan: free
    region: frankfurt       # à côté de la base Neon (eu-central-1) : ~0,1 s par appel au lieu de ~1,5 s depuis l'Oregon
    rootDir: voyage
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn serveur:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ACCES_SECRET
        generateValue: true
